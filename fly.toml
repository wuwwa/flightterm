# fly.toml app configuration file generated for flightterm on 2026-03-22T22:36:32-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flightterm'
primary_region = 'iad'

[build]

[env]
  DB_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3001'
  POLLER_ENABLED = 'true'
  POLL_INTERVAL = '135000'
  # OpenSky requests currently time out from Fly's network. Use the community
  # feed first in production; the poller still tries OpenSky if it returns empty.
  COMMUNITY_FEED_PRIMARY = 'true'
  ADSBFI_BASE = 'https://opendata.adsb.fi/api/v2'
  COMMUNITY_POINT_DELAY_MS = '1100'
  CORS_ORIGIN = 'https://flightterm.fly.dev'
  SWIM_WORKER_URL = 'http://flightterm-swim.internal:3002'
  SWIM_IDLE_TIMEOUT_MS = '300000'
  PURGE_AFTER_HOURS = '2'
  TFMS_PLANS_RETENTION_HOURS = '2'
  TFMS_FLOW_RETENTION_HOURS = '2'
  NOTAM_RETENTION_HOURS = '2'
  NOTAM_TFR_RETENTION_HOURS = '2'
  SWIM_PERSIST_SFDPS = 'false'
  SWIM_EPHEMERAL_DB_RETENTION_HOURS = '1'
  ANOMALY_SCORE_DIVISOR = '3'
  # Rate limiting defaults — override here if needed
  # RATE_WINDOW_MS = '60000'
  # RATE_MAX = '100'
  # SSE_MAX_PER_IP = '5'
  # SSE_TIMEOUT_MS = '300000'
  # POST_MAX_ITEMS = '2000'

[[mounts]]
  source = 'flightterm_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Scale fully to zero when the site is idle. A visit starts the machine and
  # the adsb.fi-first poll completes while the frontend is actively requesting.
  min_machines_running = 0

[checks]
  [checks.live]
    type = 'http'
    port = 3001
    path = '/api/health/live'
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'

  [checks.ready]
    type = 'http'
    port = 3001
    path = '/api/health/ready'
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
