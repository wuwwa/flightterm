# ── flightterm · Fly.io config ────────────────────────────────────────────────
# Deploy:  fly launch (first time) / fly deploy (updates)
# Secrets: fly secrets set AEROAPI_KEY=... OS_CLIENT_ID=... etc.
# Logs:    fly logs

app = "flightterm"
primary_region = "iad"

[build]

[env]
  PORT = "3001"
  DB_DIR = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "flightterm_data"
  destination = "/data"
