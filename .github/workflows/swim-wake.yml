name: swim-wake

# Keep flightterm-swim awake 8am–8pm ET (12:00–23:59 UTC during EDT).
# Outside this window no pings land, so Fly idle-stops the machine.
#
# Cron runs every 3 minutes during the window. Fly's auto_stop_machines
# threshold is ~5–6 min of HTTP inactivity, so pinging at 10-min
# intervals (the original config) caused a constant wake/stop cycle
# that tore down SWIM WebSocket sessions between firings. Every 3 min
# gives a safe margin plus tolerance for GH Actions occasionally
# skipping a scheduled run under high load.

on:
  schedule:
    - cron: '*/3 12-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake SWIM
        run: |
          curl -sS --max-time 30 --retry 3 --retry-delay 10 \
            https://flightterm-swim.fly.dev/health \
            || echo "ping failed (machine may be cold-starting)"
