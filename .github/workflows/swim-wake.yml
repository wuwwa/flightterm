name: swim-wake

# Keep flightterm-swim awake 8am–8pm ET (12:00–23:59 UTC during EDT).
# Outside this window no pings land, so Fly idle-stops the machine.
#
# GitHub Actions' shortest supported schedule is every 5 minutes. This cadence
# keeps regular traffic on the worker during the window; occasional scheduler
# delays may still allow Fly to idle-stop and subsequently cold-start it.

on:
  schedule:
    - cron: '*/5 12-23 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: wake SWIM
        run: |
          curl -sS --max-time 30 --retry 3 --retry-delay 10 \
            https://flightterm-swim.fly.dev/health \
            || echo "ping failed (machine may be cold-starting)"
