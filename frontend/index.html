<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121413" />
    <meta name="description" content="Live flight tracking, aircraft history, weather, and FAA air traffic data." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flightterm" />
    <meta property="og:description" content="Live flight tracking, aircraft history, weather, and FAA air traffic data." />
    <meta property="og:image" content="https://flightterm.fly.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flightterm" />
    <meta name="twitter:description" content="Live flight tracking, aircraft history, weather, and FAA air traffic data." />
    <meta name="twitter:image" content="https://flightterm.fly.dev/og.png" />
    <title>Flightterm</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Visible as soon as HTML arrives, before the React bundle can take over. */
      html, body { margin: 0; background: #121413; }
      #root:has(.launch-shell) { min-height: 100dvh; background: #121413; color: #f2f0e6; font-family: "Segoe UI", sans-serif; }
      .launch-shell { min-height: 100dvh; background: #121413; }
      .launch-shell__bar { height: 56px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid #2a2b2b; background: #101111; font-size: 17px; font-weight: 700; letter-spacing: .08em; }
      .launch-shell__status { min-height: 62px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #30342f; background: #20221f; color: #bbb9ae; font-size: 12px; }
      .launch-shell__pulse { width: 9px; height: 9px; background: #ef5a3c; }
      .launch-shell__body { padding: 14px; }
      .launch-shell__line { height: 42px; margin-top: 1px; border: 1px solid #30342f; background: #171918; }
      @media (max-width: 720px) { .launch-shell__bar { height: 52px; padding-inline: 12px; } .launch-shell__body { padding: 8px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="launch-shell" role="status" aria-live="polite" aria-label="Starting Flightterm">
        <div class="launch-shell__bar">FLIGHTTERM</div>
        <div class="launch-shell__status"><i class="launch-shell__pulse"></i>Starting Flightterm…</div>
        <div class="launch-shell__body" aria-hidden="true">
          <div class="launch-shell__line"></div><div class="launch-shell__line"></div><div class="launch-shell__line"></div><div class="launch-shell__line"></div><div class="launch-shell__line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
