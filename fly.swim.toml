# fly.swim.toml — SWIM worker service (separate from main app)
# Deploy with: fly deploy -c fly.swim.toml

app = 'flightterm-swim'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.swim'

[env]
  NODE_ENV = 'production'
  PORT = '3002'
  MAIN_APP_URL = 'http://flightterm.internal:3001'
  SWIM_FLUSH_INTERVAL_MS = '15000'
  SWIM_FNS_FLUSH_INTERVAL_MS = '1800000'

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
