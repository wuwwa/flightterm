# fly.swim.toml — SWIM worker service (separate from main app)
# Deploy with: fly deploy -c fly.swim.toml

app = 'flightterm-swim'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.swim'

[env]
  NODE_ENV = 'production'
  PORT = '3002'
  MAIN_APP_URL = 'http://flightterm.internal:3001'
  SWIM_EPHEMERAL_RING_CAP = '500'
  SWIM_SNAPSHOT_CAP = '150'
  SWIM_FLUSH_BATCH = '200'
  SWIM_FLUSH_INTERVAL_MS = '15000'
  SWIM_FNS_FLUSH_INTERVAL_MS = '1800000'
  SWIM_TFMS_MAX_QUEUE = '3000'
  SWIM_TFMS_PROCESS_BATCH = '25'
  SWIM_TFMS_PROCESS_INTERVAL_MS = '100'
  SWIM_TFMS_WINDOW_SIZE = '25'
  SWIM_SFDPS_SAMPLE_RATE = '25'
  SWIM_SFDPS_MAX_QUEUE = '300'
  SWIM_SFDPS_PROCESS_BATCH = '5'
  SWIM_SFDPS_PROCESS_INTERVAL_MS = '500'
  SWIM_SFDPS_WINDOW_SIZE = '10'
  SWIM_ITWS_SAMPLE_RATE = '5'
  SWIM_ITWS_MAX_QUEUE = '300'
  SWIM_ITWS_PROCESS_BATCH = '10'
  SWIM_ITWS_PROCESS_INTERVAL_MS = '500'
  SWIM_ITWS_WINDOW_SIZE = '10'
  SWIM_STDDS_SAMPLE_RATE = '25'
  SWIM_STDDS_MAX_QUEUE = '300'
  SWIM_STDDS_PROCESS_BATCH = '5'
  SWIM_STDDS_PROCESS_INTERVAL_MS = '500'
  SWIM_STDDS_WINDOW_SIZE = '10'
  SWIM_EXIT_ON_IDLE = 'true'
  SWIM_WORKER_IDLE_TIMEOUT_MS = '90000'

[http_service]
  internal_port = 3002
  force_https = true
  # Authenticated /api/snapshot requests renew the worker's own idle lease.
  # The proxy cannot see .internal traffic; it must not stop an active worker.
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Main app wakes this existing machine through the Machines API on NAS demand.
  min_machines_running = 0

[[restart]]
  # A clean idle exit stays stopped; actual crashes may recover automatically.
  policy = 'on-failure'
  retries = 3

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
