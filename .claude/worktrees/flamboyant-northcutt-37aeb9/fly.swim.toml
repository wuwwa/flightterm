# fly.swim.toml — SWIM worker service (separate from main app)
# Deploy with: fly deploy -c fly.swim.toml

app = 'flightterm-swim'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.swim'

[env]
  PORT = '3002'
  MAIN_APP_URL = 'http://flightterm.internal:3001'

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.live]
    type = 'http'
    port = 3002
    path = '/health'
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
